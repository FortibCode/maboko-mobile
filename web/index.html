<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Cette balise manquait au projet, alors que le gabarit Flutter la fournit.
    Sans elle, le navigateur mobile suppose une page large d'environ 980
    pixels et dessine l'application dedans ; le moteur Flutter n'injecte la
    bonne valeur qu'une fois main.dart.js telecharge — plusieurs secondes sur
    une connexion lente. Pendant ce temps, l'application s'affiche dans un
    coin de la page, le reste en blanc.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Maboko — les mains qui font le Congo. Trouvez un artisan qualifié près de chez vous, demandez un devis, ou réservez une course Allô Chauffeur.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Maboko">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Maboko</title>
  <meta name="theme-color" content="#B35B28">
  <link rel="manifest" href="manifest.json">

  <!--
    Fond de chargement. L'application pese une dizaine de megaoctets au
    premier acces : sans cela, l'utilisateur regarde une page blanche le
    temps du telechargement. Le creme de la charte enchaine sans rupture
    avec le premier ecran.
  -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #FDF3E7;
      overflow: hidden;
    }

    #chargement {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #FDF3E7;
    }

    #chargement img {
      /* Le logo occupait 108 pixels au centre d'un ecran vide : perdu.
         Il prend maintenant une largeur relative, plafonnee, pour rester
         lisible du petit telephone a l'ecran de bureau. */
      width: min(62vw, 260px);
      height: auto;
      animation: respiration 1.6s ease-in-out infinite;
    }

    @keyframes respiration {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.72; transform: scale(0.94); }
    }
  </style>
</head>
<body>
  <div id="chargement"><img src="chargement.png" alt="Maboko — les mains qui font le Congo"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Le voile disparait des que Flutter a dessine sa premiere image.
    window.addEventListener('flutter-first-frame', function () {
      var voile = document.getElementById('chargement');
      if (voile) voile.remove();
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    });
  </script>
</body>
</html>
