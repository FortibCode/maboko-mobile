name: maboko_mobile
description: Application Maboko Mobile - Les mains qui font le Congo
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Librairie HTTP pour les appels API Laravel
  http: ^1.2.0

  # Stockage local (ex: SharedPreferences)
  shared_preferences: ^2.2.2

  # Icônes Material Design
  cupertino_icons: ^1.0.8

  # Position de l'appareil : appariement des courses et suivi du trajet.
  geolocator: ^13.0.2

  # Carte OpenStreetMap. Le cahier de charges laisse le choix entre Google
  # Maps et OSM (§6.2) : OSM évite une facture d'API que le budget ne
  # supporterait pas, et suffit à l'affichage.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Ouverture du guidage vocal dans Google Maps ou Waze, déjà installés sur
  # le téléphone du chauffeur — plutôt que de réimplémenter la navigation.
  url_launcher: ^6.3.1

  # Client WebSocket : messagerie temps réel (protocole Pusher / Reverb).
  # Paquet Dart pur, donc compatible mobile et web, contrairement aux
  # implémentations natives de Pusher.
  web_socket_channel: ^3.0.1

  # Gestion des notifications locales
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.2.3
  google_sign_in: ^6.2.1
  video_player: ^2.11.1

  # Messages vocaux
  record: ^5.1.2
  just_audio: ^0.9.42
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Génération de l'icône de l'application (Logo)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Déclaration explicite de toutes les images de l'application
  assets:
    - assets/images/Maboko.jpeg
    - assets/images/maboko_logo_carre.png
    - assets/images/google_g.png
    - assets/images/bricolage.png
    - assets/images/voiture.png

    # Images des onboardings (utilisées par onboarding1/2/3.dart)
    - assets/images/I1.jpeg
    - assets/images/I2.jpeg
    - assets/images/I3.jpeg
    
    # Images des métiers (utilisées par visuel_metier.dart)
    - assets/images/metiers/

# Configuration du logo de l'application
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/maboko_logo_carre.png"
  remove_alpha_ios: true